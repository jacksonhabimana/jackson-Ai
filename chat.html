<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat with Jackson AI | Chemistry Education Portal</title>
<meta name="description" content="Ask Jackson AI any question, on any subject, and get an instant answer — built for Rwandan Senior 4-6 students.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Source+Serif+4:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Rich answer rendering: Markdown, LaTeX + chemistry equations (KaTeX/mhchem), diagrams (Mermaid) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/mhchem.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
<style>
  :root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2333;--border:#30363d;--accent:#38bdf8;--gold:#e8c547;--green:#34d399;--red:#f87171;--text:#e6edf3;--muted:#8b949e;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--text);font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.75;min-height:100vh;display:flex;flex-direction:column;}

  nav{position:sticky;top:0;z-index:100;background:rgba(13,17,23,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
  .nav-inner{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  .nav-brand{color:var(--text);text-decoration:none;font-weight:700;display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:.9rem;}
  .nav-back{color:var(--accent);text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:.8rem;border:1px solid rgba(56,189,248,.3);padding:6px 12px;border-radius:20px;}
  .nav-back:hover{background:rgba(56,189,248,.1);}

  main{flex:1;max-width:800px;width:100%;margin:0 auto;padding:32px 20px 60px;display:flex;flex-direction:column;}

  .chat-hero{text-align:center;margin-bottom:24px;}

  .chat-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
  #new-chat-btn,#history-btn{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:7px 14px;border-radius:20px;font-size:.8rem;cursor:pointer;font-family:'JetBrains Mono',monospace;
  }
  #new-chat-btn:hover,#history-btn:hover{border-color:var(--accent);color:var(--accent);}
  .history-wrap{position:relative;}
  #history-panel{
    display:none;position:absolute;right:0;top:calc(100% + 6px);width:min(340px,88vw);max-height:65vh;overflow-y:auto;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:50;
  }
  #history-panel.open{display:block;}
  .history-item{
    display:flex;justify-content:space-between;align-items:center;gap:6px;
    padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:.82rem;
  }
  .history-item:last-child{border-bottom:none;}
  .history-item:hover{background:var(--surface2);}
  .history-item-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-item-date{font-size:.68rem;color:var(--muted);white-space:nowrap;margin-left:6px;}
  .history-item-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;flex-shrink:0;}
  .history-item-del:hover{color:var(--red);}
  .history-empty{padding:16px;text-align:center;color:var(--muted);font-size:.8rem;}
  .history-top{position:sticky;top:0;background:var(--surface);padding:8px;border-bottom:1px solid var(--border);z-index:2;display:flex;gap:6px;align-items:center;}
  .history-search{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 9px;font-size:.8rem;}
  .history-clear{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 8px;font-size:.7rem;cursor:pointer;white-space:nowrap;}
  .history-clear:hover{color:var(--red);border-color:var(--red);}
  .history-group{padding:6px 12px 3px;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--surface2);}
  .chat-hero h1{font-family:'Playfair Display',serif;font-size:2rem;color:#fff;margin-bottom:6px;}
  .chat-hero p{color:var(--muted);font-size:.92rem;}

  #chat-box{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;
    display:flex;flex-direction:column;overflow:hidden;min-height:60vh;
  }
  #chat-messages{
    flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;
  }
  .chat-msg{padding:10px 14px;border-radius:10px;max-width:80%;line-height:1.55;font-size:.95rem;}
  .chat-msg.user{align-self:flex-end;background:var(--accent);color:#0d1117;font-weight:500;}
  .chat-msg.bot{align-self:flex-start;background:var(--surface2);color:var(--text);border:1px solid var(--border);max-width:92%;}
  .chat-msg.bot.loading{color:var(--muted);font-style:italic;}
  .chat-msg.bot h1,.chat-msg.bot h2,.chat-msg.bot h3{font-family:'Playfair Display',serif;line-height:1.3;margin:.6em 0 .3em;}
  .chat-msg.bot h1{font-size:1.25rem;}
  .chat-msg.bot h2{font-size:1.12rem;}
  .chat-msg.bot h3{font-size:1.02rem;}
  .chat-msg.bot p{margin:.4em 0;}
  .chat-msg.bot ul,.chat-msg.bot ol{margin:.4em 0 .4em 1.3em;padding:0;}
  .chat-msg.bot li{margin:.2em 0;}
  .chat-msg.bot strong{color:var(--gold);}
  .chat-msg.bot code{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:.85em;}
  .chat-msg.bot pre{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;overflow-x:auto;margin:.5em 0;}
  .chat-msg.bot pre code{background:none;border:none;padding:0;}
  .chat-msg.bot table{border-collapse:collapse;margin:.5em 0;width:100%;font-size:.88rem;}
  .chat-msg.bot th,.chat-msg.bot td{border:1px solid var(--border);padding:5px 9px;text-align:left;}
  .chat-msg.bot th{background:var(--bg);color:var(--gold);}
  .chat-msg.bot blockquote{border-left:3px solid var(--accent);margin:.5em 0;padding:.2em .8em;color:var(--muted);}
  .chat-msg.bot a{color:var(--accent);}
  .chat-msg.bot .katex{font-size:1.02em;}
  .chat-msg.bot .katex-display{overflow-x:auto;overflow-y:hidden;margin:.5em 0;}


  .doc-msg{max-width:92%;}
  .doc-intro{margin:0 0 10px;}
  .doc-card{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .doc-icon{font-size:1.8rem;line-height:1;}
  .doc-info{flex:1;min-width:150px;}
  .doc-title{font-weight:600;color:var(--text);word-break:break-word;}
  .doc-sub{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-top:2px;}
  .doc-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .doc-btns button{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 13px;font-family:'JetBrains Mono',monospace;font-size:.75rem;cursor:pointer;}
  .doc-btns button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .doc-btns button:hover{opacity:.85;}
  .doc-preview{display:none;margin-top:12px;max-height:480px;overflow:auto;background:#e9edf2;border-radius:8px;padding:14px;}
  .doc-preview.open{display:block;}
  .doc-page{background:#fff;color:#000;font-family:Arial,sans-serif;font-size:11pt;line-height:1.5;padding:22px 26px;box-shadow:0 1px 6px rgba(0,0,0,.25);}
  .doc-page h1{font-size:1.3em;margin:0 0 .6em;} .doc-page h2{font-size:1.1em;margin:1em 0 .4em;}
  .doc-page table{border-collapse:collapse;} .doc-page td,.doc-page th{border:1px solid #444;padding:3px 7px;}
  .doc-page ol,.doc-page ul{padding-left:1.4em;}
  .doc-page svg{max-width:100%;height:auto;} .doc-page img{max-width:100%;height:auto;display:block;margin:6px 0;}

  .fig-actions{display:flex;gap:6px;margin-top:6px;}
  .fig-actions button{background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:14px;padding:3px 10px;font-family:'JetBrains Mono',monospace;font-size:.68rem;cursor:pointer;}
  .fig-actions button:hover{border-color:var(--accent);color:var(--accent);}

  #drop-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(10,14,22,.82);backdrop-filter:blur(2px);}
  #drop-overlay.show{display:flex;}
  #drop-overlay>div{border:3px dashed var(--accent);border-radius:20px;padding:46px 64px;text-align:center;color:var(--text);font-size:1.25rem;background:rgba(20,26,40,.9);}
  #drop-overlay small{display:block;margin-top:8px;color:var(--muted);font-size:.8rem;}

  #suggestions{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px;}
  #suggestions button{background:var(--surface2,var(--bg));border:1px solid var(--border);color:var(--text);border-radius:18px;padding:7px 13px;font-family:inherit;font-size:.82rem;cursor:pointer;text-align:left;}
  #suggestions button:hover{border-color:var(--accent);color:var(--accent);}
  .code-wrap{position:relative;}
  .code-copy{position:absolute;top:6px;right:6px;background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:2px 9px;font-family:'JetBrains Mono',monospace;font-size:.66rem;cursor:pointer;opacity:.85;}
  .code-copy:hover{border-color:var(--accent);color:var(--accent);opacity:1;}

  .user-actions{align-self:flex-end;display:flex;gap:6px;margin:-4px 2px 0 0;}
  .user-actions button{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:14px;padding:2px 10px;font-family:'JetBrains Mono',monospace;font-size:.66rem;cursor:pointer;opacity:.8;}
  .user-actions button:hover{border-color:var(--accent);color:var(--accent);opacity:1;}
  .msg-actions{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .msg-actions button{background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:16px;padding:4px 11px;font-family:'JetBrains Mono',monospace;font-size:.7rem;cursor:pointer;}
  .msg-actions button:hover{border-color:var(--accent);color:var(--accent);}
  .chat-msg.bot .svg-diagram{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px;margin:.5em 0;overflow-x:auto;text-align:center;}
  .chat-msg.bot .svg-diagram > svg{width:100%;max-width:900px;height:auto;}
  .chat-msg.bot .mermaid{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;margin:.5em 0;overflow-x:auto;display:flex;justify-content:center;}

  #chat-input-row{display:flex;align-items:center;border-top:1px solid var(--border);padding:10px;gap:8px;}
  .chat-plus{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.15rem;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .chat-plus:hover{border-color:var(--accent);color:var(--accent);}
  #image-preview-row{padding:8px 14px 0;display:flex;align-items:center;gap:8px;}
  #image-preview-row img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
  #image-preview-remove{background:var(--surface2);border:1px solid var(--border);color:var(--muted);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.8rem;line-height:1;}
  #image-preview-remove:hover{color:var(--red);border-color:var(--red);}
  #chat-input{
    flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);
    padding:12px 14px;font-size:.95rem;font-family:'Source Serif 4',Georgia,serif;outline:none;
  }
  #chat-input:focus{border-color:var(--accent);}
  #chat-send{
    background:var(--accent);color:#0d1117;border:none;border-radius:8px;padding:0 20px;
    font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.82rem;
  }
  #chat-send:hover{opacity:.9;}
  #chat-send:disabled{opacity:.5;cursor:not-allowed;}

  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:18px;border-top:1px solid var(--border);}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-brand" href="index.html">
      <img src="assets/profile.jpg" alt="Jackson Habimana" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">
      Jackson Habimana
    </a>
    <a class="nav-back" href="index.html">&larr; Back to Home</a>
  </div>
</nav>

<main>
  <div class="chat-hero">
    <h1>💬 Chat with Jackson AI</h1>
    <p>Ask me anything: school subjects, writing, coding, translation, news, advice and more.</p>
  </div>

  <div class="chat-toolbar">
    <button id="new-chat-btn" type="button">+ New Chat</button>
    <div class="history-wrap">
      <button id="history-btn" type="button">🕘 Previous Chat</button>
      <div id="history-panel"></div>
    </div>
  </div>

  <div id="chat-box">
    <div id="chat-messages">
      <div class="chat-msg bot" id="initial-greeting">Hi! 👋 What would you like to ask?</div>
    </div>
    <div id="image-preview-row" style="display:none;"></div>
    <div id="chat-input-row">
      <button class="chat-plus" id="chat-plus-btn" aria-label="Attach a photo or file" type="button">+</button>
      <input type="file" id="chat-file-input" accept="image/*,.pdf,.txt,.md,.csv,.tsv,.json,.xml,.html,.docx,application/pdf,text/plain" style="display:none;">
      <input id="chat-input" type="text" placeholder="Write a message..." autocomplete="off">
      <button id="chat-send">Send</button>
    </div>
  </div>
</main>

<footer>
  &#9883; Jackson Habimana &mdash; Chemistry Education Portal
  <div id="version-line" style="font-size:.68rem;opacity:.65;margin-top:4px;"></div>
</footer>

<script>
  const WORKER_URL = "https://chem-payment.hajackson2020.workers.dev/chat";
  // Mermaid and the molecule drawer are big: load them only when an answer really contains a diagram or structure
  let _mmP = null, _smP = null;
  function ensureMermaid() {
    if (!_mmP) _mmP = (window.mermaid ? Promise.resolve(true) : loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.4/mermaid.min.js')).then((ok) => {
      if (ok && window.mermaid) { mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' }); return true; }
      _mmP = null; return false;
    });
    return _mmP;
  }
  function ensureSmiles() {
    if (!_smP) _smP = (window.SmilesDrawer ? Promise.resolve(true) : loadScriptOnce('https://cdn.jsdelivr.net/npm/smiles-drawer@2.1.7/dist/smiles-drawer.min.js')).then((ok) => {
      if (ok && window.SmilesDrawer) return true;
      _smP = null; return false;
    });
    return _smP;
  }
  const messages = document.getElementById('chat-messages');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');
  const plusBtn = document.getElementById('chat-plus-btn');
  const fileInput = document.getElementById('chat-file-input');
  const previewRow = document.getElementById('image-preview-row');

  let pendingImage = null; // { data: base64 (no prefix), mimeType, kind: 'image'|'pdf' }
  let pendingDoc = null;   // searchable document waiting to be sent: { name, pages[], kind }
  let pendingScan = null;  // { name, note } for a big scanned PDF that is sent as page pictures
  let activeDoc = null;    // the document this chat is about; kept so follow-up questions still see it
  let pendingImages = null;   // [{ data, mimeType }] pages of a big scanned PDF, plus pendingNote
  try { localStorage.removeItem('jai_name'); } catch (e) {} // names are no longer used

  // Chat history belongs to the signed-in account: each account gets its own list on this
  // device, so another person (or another account) never sees your chats. Not signed in = 'guest'.
  const SESSIONS_KEY = (function () {
    let who = 'guest';
    try { who = (localStorage.getItem('teacher_name') || '').trim().toLowerCase() || 'guest'; } catch (e) {}
    return 'jai_sessions_' + who.replace(/[^a-z0-9@._-]+/g, '_').slice(0, 60);
  })();
  try { // old shared list from before accounts: keep it only for guests, never show it to a signed-in account
    const legacy = localStorage.getItem('jai_sessions');
    if (legacy !== null) {
      if (SESSIONS_KEY === 'jai_sessions_guest' && !localStorage.getItem(SESSIONS_KEY)) localStorage.setItem(SESSIONS_KEY, legacy);
      if (SESSIONS_KEY === 'jai_sessions_guest') localStorage.removeItem('jai_sessions');
    }
  } catch (e) {}
  let currentSessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  let currentMessages = []; // [{sender:'user'|'bot', kind:'text'|'bot-image', text, imageUrl, caption}]

  function getSessions() {
    try { return JSON.parse(localStorage.getItem(SESSIONS_KEY) || '[]'); }
    catch (e) { return []; }
  }
  function saveSessions(arr) {
    try { localStorage.setItem(SESSIONS_KEY, JSON.stringify(arr)); return true; }
    catch (e) { return false; /* storage full or unavailable */ }
  }
  function persistCurrentSession() {
    if (!currentMessages.some(m => m.sender === 'user')) return; // nothing real to save yet
    const sessions = getSessions();
    const firstUserMsg = currentMessages.find(m => m.sender === 'user');
    const title = (firstUserMsg?.text || 'New chat').replace(/\s+/g, ' ').slice(0, 70);
    const idx = sessions.findIndex(s => s.id === currentSessionId);
    const record = { id: currentSessionId, title, updatedAt: Date.now(), messages: currentMessages };
    if (idx >= 0) sessions[idx] = record; else sessions.unshift(record);
    if (!saveSessions(sessions)) {
      // Browser storage is full: shrink the very long messages (e.g. pasted
      // files) instead of ever deleting old chats.
      const compact = sessions.map(sess => ({
        ...sess,
        messages: (sess.messages || []).map(m =>
          m.text && m.text.length > 4000 ? { ...m, text: m.text.slice(0, 4000) + ' …' } : m)
      }));
      saveSessions(compact);
    }
  }
  function relativeDate(ts) {
    const d = new Date(ts);
    const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) + ' · ' + time;
  }
  function historyGroupLabel(ts) {
    const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
    const dayMs = 86400000;
    const diffDays = Math.floor((startOfToday.getTime() - ts) / dayMs) + 1; // 0 = today
    if (ts >= startOfToday.getTime()) return 'Today';
    if (diffDays <= 1) return 'Yesterday';
    if (diffDays <= 7) return 'Previous 7 days';
    if (diffDays <= 30) return 'Previous 30 days';
    return new Date(ts).toLocaleDateString([], { month: 'long', year: 'numeric' });
  }
  function renderHistoryPanel(filter) {
    const panel = document.getElementById('history-panel');
    const keepSearch = document.getElementById('history-search');
    const q = (filter !== undefined ? filter : (keepSearch ? keepSearch.value : '')).trim().toLowerCase();
    const all = getSessions().sort((a, b) => b.updatedAt - a.updatedAt);
    panel.innerHTML = '';

    const top = document.createElement('div');
    top.className = 'history-top';
    const search = document.createElement('input');
    search.id = 'history-search';
    search.className = 'history-search';
    search.type = 'search';
    search.placeholder = 'Search your chats (' + all.length + ')';
    search.value = q;
    search.addEventListener('input', () => {
      renderHistoryPanel(search.value);
      const again = document.getElementById('history-search');
      again.focus(); again.setSelectionRange(again.value.length, again.value.length);
    });
    top.appendChild(search);
    if (all.length) {
      const clr = document.createElement('button');
      clr.type = 'button'; clr.className = 'history-clear'; clr.textContent = 'Clear all';
      clr.addEventListener('click', () => {
        if (confirm('Delete ALL your saved chats on this device? This cannot be undone.')) {
          saveSessions([]); renderHistoryPanel('');
        }
      });
      top.appendChild(clr);
    }
    panel.appendChild(top);

    const sessions = q
      ? all.filter(s => (s.title || '').toLowerCase().includes(q) ||
          (s.messages || []).some(m => (m.text || '').toLowerCase().includes(q)))
      : all;
    if (!sessions.length) {
      const empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = all.length ? 'No chats match your search' : 'No past chats yet';
      panel.appendChild(empty);
      return;
    }
    let lastLabel = null;
    sessions.forEach(s => {
      const label = historyGroupLabel(s.updatedAt);
      if (label !== lastLabel) {
        const g = document.createElement('div');
        g.className = 'history-group';
        g.textContent = label;
        panel.appendChild(g);
        lastLabel = label;
      }
      const item = document.createElement('div');
      item.className = 'history-item';
      const textSpan = document.createElement('span');
      textSpan.className = 'history-item-text';
      textSpan.textContent = s.title;
      const dateSpan = document.createElement('span');
      dateSpan.className = 'history-item-date';
      dateSpan.textContent = relativeDate(s.updatedAt);
      const delBtn = document.createElement('button');
      delBtn.className = 'history-item-del';
      delBtn.type = 'button';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        saveSessions(getSessions().filter(x => x.id !== s.id));
        renderHistoryPanel();
      });

  // ── Figures: real photos the AI asks for, plus copy / download for every figure ──
  function splitImageMarkers(text) {
    const queries = [], crops = [];
    const clean = String(text || '')
      .replace(/\[\[\s*IMAGE\s*:\s*([^\]\n]{2,90}?)\s*\]\]/gi, (m, q) => { queries.push(q.trim()); return ''; })
      .replace(/\[\[\s*CROP\s*:\s*([^\]\n]{5,80}?)\s*\]\]/gi, (m, spec) => { const c = parseCropSpec(spec); if (c) crops.push(c); return ''; })
      .replace(/\[\[[^\]]*$/, '').replace(/\n{3,}/g, '\n\n').trimEnd();
    return { clean, queries: queries.slice(0, 2), crops: crops.slice(0, 6) };
  }
  // "520,60,900,940" or "520,60,900,940,page=2" -> { box:[ymin,xmin,ymax,xmax] on a 0-1000 scale, page }
  function parseCropSpec(spec) {
    const pg = (String(spec).match(/page\s*=\s*(\d+)/i) || [])[1];
    const nums = String(spec).replace(/page\s*=\s*\d+/i, '').match(/\d+(?:\.\d+)?/g);
    if (!nums || nums.length < 4) return null;
    let [y1, x1, y2, x2] = nums.slice(0, 4).map(Number).map(v => Math.max(0, Math.min(1000, v)));
    if (y2 < y1) [y1, y2] = [y2, y1]; if (x2 < x1) [x1, x2] = [x2, x1];
    if (y2 - y1 < 20 || x2 - x1 < 20) return null;
    return { box: [y1, x1, y2, x2], page: pg ? parseInt(pg, 10) : 1 };
  }
  // cut the figure out of the user's own picture
  function cropToDataUrl(srcDataUrl, box) {
    return new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => {
        try {
          const W = im.naturalWidth, H = im.naturalHeight, pad = 0.012;
          const x1 = Math.max(0, (box[1] / 1000 - pad) * W), y1 = Math.max(0, (box[0] / 1000 - pad) * H);
          const x2 = Math.min(W, (box[3] / 1000 + pad) * W), y2 = Math.min(H, (box[2] / 1000 + pad) * H);
          const w = Math.max(1, x2 - x1), h = Math.max(1, y2 - y1), sc = Math.min(1, 1100 / w);
          const cv = document.createElement('canvas'); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
          const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
          g.drawImage(im, x1, y1, w, h, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/jpeg', 0.88));
        } catch (e) { reject(e); }
      };
      im.onerror = () => reject(new Error('crop source failed'));
      im.src = srcDataUrl;
    });
  }

  // ── Real chemical structures: the AI writes SMILES, the browser draws accurate skeletal formulas ──
  // Block format, one structure per line:  SMILES | label     and a line  <->  or  ->  draws an arrow between structures.
  // Drawn big, with solid black atom letters, at most 3 per row, so it stays readable on screen, in Word and in PDF.
  function renderSmilesIn(root) {
    if (!root || !window.SmilesDrawer) return;
    root.querySelectorAll('.smiles-fig').forEach((holder) => {
      if (holder.dataset.done) return; holder.dataset.done = '1';
      const NS = 'http://www.w3.org/2000/svg';
      const items = [];
      (holder.getAttribute('data-smiles') || '').split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
        if (/^(<->|<=>|->|=>|→|⟷|↔)$/.test(l)) items.push({ arrow: /<|⟷|↔/.test(l) ? 'both' : 'one' });
        else { const parts = l.split('|'); items.push({ smiles: parts[0].trim(), label: (parts[1] || '').trim() }); }
      });
      const W = 300, H = 240, GAP = 64, LAB = 40, PER_ROW = 3;
      let ok = true; const kids = [];
      const sd = new SmilesDrawer.SvgDrawer({ width: W, height: H, padding: 18, bondThickness: 2, bondLength: 38, fontSizeLarge: 17, fontSizeSmall: 12, compactDrawing: false });
      let x = 0, y = 0, inRow = 0, maxX = 0, pending = null;
      const arrowAt = (ax, ay, kind) => {
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('x', ax + GAP / 2); t.setAttribute('y', ay + H / 2 + 10); t.setAttribute('text-anchor', 'middle');
        t.setAttribute('font-size', '34'); t.setAttribute('font-family', 'Arial, sans-serif'); t.setAttribute('fill', '#000000');
        t.textContent = kind === 'both' ? '⟷' : '→'; kids.push(t);
      };

        if (it.arrow) { pending = it.arrow; continue; }
        if (inRow === PER_ROW) { x = 0; y += H + LAB; inRow = 0; }
        if (pending) { if (inRow > 0 || y > 0) { arrowAt(x, y, pending); x += GAP; } pending = null; }
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
        try { SmilesDrawer.parse(it.smiles, (tree) => { sd.draw(tree, svg, 'oldschool'); }, () => { ok = false; }); } catch (e) { ok = false; }
        if (!ok) break;
        svg.setAttribute('x', x); svg.setAttribute('y', y);
        kids.push(svg);
        if (it.label) {
          const t = document.createElementNS(NS, 'text');
          t.setAttribute('x', x + W / 2); t.setAttribute('y', y + H + 22); t.setAttribute('text-anchor', 'middle');
          t.setAttribute('font-size', '20'); t.setAttribute('font-weight', '600'); t.setAttribute('font-family', 'Arial, sans-serif'); t.setAttribute('fill', '#000000');
          t.textContent = it.label; kids.push(t);

  // default = branches (one start, several paths); first line "mode: chain" = one step after another.
  function renderSchemeIn(root) {
    if (!root || !window.SmilesDrawer) return;
    root.querySelectorAll('.scheme-fig').forEach((holder) => {
      if (holder.dataset.done) return; holder.dataset.done = '1';
      const NS = 'http://www.w3.org/2000/svg';
      const raw = holder.getAttribute('data-scheme') || '';
      let mode = 'branches', start = null; const steps = [];
      raw.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
        let m;
        if ((m = l.match(/^mode\s*:\s*(\w+)/i))) { mode = /chain|linear|steps/i.test(m[1]) ? 'chain' : 'branches'; return; }
        if ((m = l.match(/^start\s*:\s*(.*)$/i))) { const q = m[1].split('|'); start = { smiles: (q[0] || '').trim(), label: (q[1] || '').trim() }; return; }
        const q = l.split('|'); steps.push({ smiles: (q[0] || '').trim(), label: (q[1] || '').trim(), reagents: (q.slice(2).join('|') || '').trim() });
      });

      const sd = new SmilesDrawer.SvgDrawer({ width: CW, height: CH, padding: 16, bondThickness: 2, bondLength: 36, fontSizeLarge: 16, fontSizeSmall: 11, compactDrawing: false });
      const el = (n, a, txt) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };

        words.forEach(w => { if ((cur + ' ' + w).trim().length > 24 && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
        if (cur) lines.push(cur);
        const lh = size + 4, top = bottomY - (lines.length - 1) * lh;
        lines.forEach((ln, i) => {
          const t = el('text', { x: cx, y: top + i * lh, 'text-anchor': anchor || 'middle', 'font-size': size, 'font-family': 'Arial, sans-serif', fill: '#000000' });
          if (bold) t.setAttribute('font-weight', '700');
          let k = 0;
          while (k < ln.length) {
            const isSub = k > 0 && /[0-9]/.test(ln[k]) && /[A-Za-z)\]]/.test(ln[k - 1]) && !/[0-9]/.test(ln[k - 1]);
            if (isSub) {

              } else k = j;
            } else {
              let e = k + 1; while (e < ln.length && !(/[0-9]/.test(ln[e]) && /[A-Za-z)\]]/.test(ln[e - 1]) && !/[0-9]/.test(ln[e - 1]))) e++;
              t.appendChild(el('tspan', {}, ln.slice(k, e))); k = e;

      function cell(c, x, y) { // one structure (or just its name if it cannot be drawn) with its label under it
        let drawn = false;

  }

  // ── Document memory: keep the whole document, send only the pages that matter for each question ──
  const DOC_BUDGET = 60000; // characters of document sent with each question (about 15,000 tokens)
  const DOC_STOP = new Set('a an and are as at be by do does did for from how i if in is it me my of on or please the this that these those to was were what when where which who why with you your can could would should give show write tell about above below attached document file pdf book'.split(' '));

    if (!doc.norm) doc.norm = doc.pages.map(p => ' ' + docTokens(p).join(' ') + ' ');

    const terms = Array.from(new Set(raw.filter(w => !DOC_STOP.has(w))));

        for (let k = 1; k <= 6 && x.i + k < n && score[x.i + k] >= 0.2 * top; k++) add(x.i + k);
        for (let k = 1; k <= 6 && x.i - k >= 0 && score[x.i - k] >= 0.2 * top; k++) add(x.i - k);
        add(x.i + 1 < n ? x.i + 1 : x.i); add(x.i - 1 >= 0 ? x.i - 1 : x.i);
      });
      ranked.slice(3, 12).forEach(x => add(x.i));
    }
    const nums = Array.from(chosen).sort((a, b) => a - b);
    return { text: render(nums), note: label.toLowerCase() + 's ' + describeNums(nums.map(i => i + 1)) + ' of ' + n, nums };
  }
  // keep the document across page reloads (IndexedDB can hold large documents; localStorage cannot)
  function docDb() { return new Promise((res, rej) => { const r = indexedDB.open('jackson-ai-doc', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  async function docSave(d) { try { const db = await docDb(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put({ name: d.name, pages: d.pages, kind: d.kind }, 'active'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) { /* optional */ } }
  async function docLoad() { try { const db = await docDb(); return await new Promise((res, rej) => { const rq = db.transaction('kv').objectStore('kv').get('active'); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => rej(rq.error); }); } catch (e) { return null; } }
  async function docClear() { try { const db = await docDb(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete('active'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) { /* optional */ } }
  function forgetActiveDoc() { activeDoc = null; docClear(); showActiveDocChip(); }
  function showActiveDocChip() {
    if (!activeDoc || pendingImage || pendingDoc || pendingImages) return;
    previewRow.innerHTML = '';
    const chip = document.createElement('div');
    chip.style.cssText = 'display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--accent);border-radius:8px;padding:6px 10px;font-size:.78rem;color:var(--text);';
    chip.textContent = '📄 ' + activeDoc.name + ' (' + activeDoc.pages.length + ' ' + docLabel(activeDoc).toLowerCase() + 's) · ask me about it';
    const x = document.createElement('button'); x.type = 'button'; x.id = 'doc-forget'; x.textContent = '✕'; x.title = 'Stop using this document';
    x.addEventListener('click', forgetActiveDoc);
    chip.appendChild(x); previewRow.appendChild(chip); previewRow.style.display = 'flex';
  }

  // ── Big files: read them in the browser so the size of the upload does not matter ──
  const MAX_TEXT_CHARS = 300000; // about 75,000 words
  function loadScriptOnce(src) {
    return new Promise(res => { const sc = document.createElement('script'); sc.src = src; sc.onload = () => res(true); sc.onerror = () => res(false); document.head.appendChild(sc); });
  }
  async function ensurePdfJs() {
    if (window.pdfjsLib) return true;
    const ok = await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    if (!ok || !window.pdfjsLib) return false;
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    return true;
  }
  // Read every page's text (no page limit). Returns { pdf, pages, hasText }.
  async function readPdfPages(file, progress) {
    if (!(await ensurePdfJs())) throw new Error('PDF reader could not load');
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pages = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      if (p % 5 === 1 || p === pdf.numPages) progress('Reading ' + file.name + ' — page ' + p + ' of ' + pdf.numPages + '…');
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      let line = '';
      tc.items.forEach(it => { line += it.str + (it.hasEOL ? '\n' : ' '); });
      pages.push(line.trim());
      page.cleanup();
    }
    const readable = pages.join('').replace(/\s+/g, '').length;
    return { pdf, pages, hasText: readable > Math.min(pdf.numPages, 10) * 80 };
  }
  // Scanned PDF (pictures of pages): turn the first pages into pictures
  async function renderScanPages(pdf, name, progress) {
    const maxPages = Math.min(pdf.numPages, 10), images = [];
    for (let p = 1; p <= maxPages; p++) {
      progress('Scanning ' + name + ' — page ' + p + ' of ' + maxPages + '…');
      const page = await pdf.getPage(p);
      const vp = page.getViewport({ scale: 1.4 });
      const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
      await page.render({ canvasContext: g, viewport: vp }).promise;
      const used = images.reduce((n, im) => n + im.data.length, 0);
      images.push({ data: cv.toDataURL('image/jpeg', used > 9e6 ? 0.45 : 0.72).split(',')[1], mimeType: 'image/jpeg' }); // lower quality if the pages are very heavy
      page.cleanup();
    }
    return { images, note: 'scanned PDF: first ' + maxPages + (pdf.numPages > maxPages ? ' of ' + pdf.numPages : '') + ' pages' };
  }
  async function readDocx(file) {
    if (!window.mammoth) { const ok = await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'); if (!ok || !window.mammoth) throw new Error('Word reader could not load'); }
    const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return r.value || '';
  }
  function clipText(t) { return t.length > MAX_TEXT_CHARS ? { text: t.slice(0, MAX_TEXT_CHARS), note: 'first ' + MAX_TEXT_CHARS.toLocaleString() + ' characters' } : { text: t, note: '' }; }

  plusBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => { const f = fileInput.files[0]; if (f) attachFile(f); });
  async function attachFile(file) {
    if (!file) return;
    if (sendBtn.disabled) { alert('Please wait until the current answer or file has finished, then try again.'); fileInput.value = ''; return; }
    const lower = (file.name || 'pasted-image.png').toLowerCase();
    clearPendingImage(); // a new file replaces the previous one (this also resets the input)
    sendBtn.disabled = true;
    try {
      if (file.type.startsWith('image/')) {
        showPendingFileChip('Preparing ' + file.name + '…');
        const dataUrl = await fileToCompressedImage(file);
        const [prefix, base64] = dataUrl.split(',');
        const mimeType = prefix.match(/data:(.*?);/)[1];
        pendingImage = { data: base64, mimeType, kind: 'image' };
        showPendingImagePreview(dataUrl);
      } else if (file.type === 'application/pdf' || lower.endsWith('.pdf')) {
        const small = file.size <= 8 * 1024 * 1024;
        let read = null;
        try { read = await readPdfPages(file, (m) => showPendingFileChip(m)); }
        catch (e) { console.warn('PDF text reader unavailable', e); if (!small) throw e; }
        if (read && read.hasText) {
          pendingDoc = makeDoc(file.name, read.pages, 'pdf');
          if (small) { // first question: the AI reads the original file; follow-ups use the saved text
            const dataUrl = await fileToDataUrl(file);
            pendingImage = { data: dataUrl.split(',')[1], mimeType: 'application/pdf', kind: 'pdf' };
          }
          showPendingFileChip(file.name + ' (' + read.pages.length + ' pages)');
        } else if (small) {
          const dataUrl = await fileToDataUrl(file);
          pendingImage = { data: dataUrl.split(',')[1], mimeType: 'application/pdf', kind: 'pdf' };
          showPendingFileChip(file.name);
        } else {
          const r = await renderScanPages(read.pdf, file.name, (m) => showPendingFileChip(m));
          pendingImages = r.images; pendingScan = { name: file.name, note: r.note };
          showPendingFileChip(file.name + ' (' + r.note + ')');
        }
      } else if (lower.endsWith('.docx')) {
        showPendingFileChip('Reading ' + file.name + '…');
        const text = await readDocx(file);
        if (!text.trim()) throw new Error('empty document');
        pendingDoc = makeDoc(file.name, chunkText(text), 'text');
        showPendingFileChip(file.name + ' (' + pendingDoc.pages.length + ' sections)');
      } else if (/\.(txt|md|csv|tsv|json|xml|html?)$/.test(lower) || file.type.startsWith('text/')) {
        showPendingFileChip('Reading ' + file.name + '…');
        const text = await fileToText(file);
        pendingDoc = makeDoc(file.name, chunkText(text), 'text');
        showPendingFileChip(file.name + ' (' + pendingDoc.pages.length + ' sections)');
      } else {
        alert('Please choose an image, a PDF, a Word (.docx) file, or a text file (.txt, .csv, .md…).');
        clearPendingImage();
        return;
      }
      input.focus();
    } catch (err) {
      console.error('Upload failed', err);
      alert('Could not read that file. Please try another, or paste the text.');
      clearPendingImage();
    } finally { sendBtn.disabled = false; }
  }

  // Version check: shows whether the page and the Cloudflare Worker are from the same release
  (function versionCheck() {
    const PAGE_VERSION = '2026-10-05.4', NEEDS_WORKER = '2026-10-05.3', line = document.getElementById('version-line');
    if (!line) return;
    fetch(WORKER_URL.replace(/\/chat$/, '/version')).then(r => r.ok ? r.json() : Promise.reject()).then(d => {
      line.textContent = String(d.worker) >= NEEDS_WORKER ? 'Page ' + PAGE_VERSION + ' · worker ' + d.worker + ' · up to date ✓' : '⚠ Page ' + PAGE_VERSION + ' but worker ' + d.worker + ': please upload the newest worker.js to Cloudflare';
    }).catch(() => { line.textContent = '⚠ Page ' + PAGE_VERSION + ': the worker is an older version. Please upload the newest worker.js to Cloudflare'; });
  })();
  showSuggestions(); // starter ideas (defined above, so it is safe to call here)
  docLoad().then(d => { if (d && d.pages && d.pages.length) { activeDoc = makeDoc(d.name, d.pages, d.kind); showActiveDocChip(); } });
  // ── Drag & drop a file anywhere on the page, or paste a picture (Ctrl+V) ──
  (function setupDropAndPaste() {
    const overlay = document.createElement('div');
    overlay.id = 'drop-overlay';
    overlay.innerHTML = '<div><div style="font-size:2.4rem">📎</div><div>Drop your file here</div><small>Photo, PDF, Word or text file</small></div>';
    document.body.appendChild(overlay);
    let depth = 0;
    const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); depth++; overlay.classList.add('show'); });
    window.addEventListener('dragover', (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }); // also stops the browser opening the file
    window.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) overlay.classList.remove('show'); });
    window.addEventListener('drop', (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault(); depth = 0; overlay.classList.remove('show');
      const files = Array.from(e.dataTransfer.files || []);
      if (!files.length) return;
      if (files.length > 1) alert('I can read one file at a time, so I will use "' + files[0].name + '". Send the others afterwards, one by one.');
      attachFile(files[0]);
    });
    document.addEventListener('paste', (e) => {
      const files = Array.from((e.clipboardData && e.clipboardData.files) || []);
      const img = files.find(f => f.type.startsWith('image/'));
      if (img) { e.preventDefault(); attachFile(img); }
    });
  })();

  document.getElementById('new-chat-btn').addEventListener('click', startNewChat);
  document.getElementById('history-btn').addEventListener('click', () => {
    const panel = document.getElementById('history-panel');
    const isOpening = !panel.classList.contains('open');
    if (isOpening) renderHistoryPanel();
    panel.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    const wrap = document.querySelector('.history-wrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('history-panel').classList.remove('open');
    }
  });

  sendBtn.addEventListener('click', () => sendQuestion());
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendQuestion(); });

  // Auto-send a question passed in via ?q= from the homepage nav box.
  const params = new URLSearchParams(window.location.search);
  const incomingQ = params.get('q');
  if (incomingQ) {
    sendQuestion(incomingQ);
  } else {
    input.focus();
  }
</script>
